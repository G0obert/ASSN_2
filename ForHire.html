<h1>Employment Application Form</h1>

<form 
onsubmit="alert('Form submitted successfully!'); return false;"
>


<fieldset>

<legend>
Personal Information
</legend>


<label>
Full Name*
</label>


<input 
type="text"
placeholder="e.g. John Smith"
required
>


<br>


<label>
Physical Address*
</label>


<input
type="text"
placeholder="e.g. 180 Ang Mo Kio Avenue 8, Singapore 569830"
>



<br>


<label>
Email*
</label>


<input
type="email"
placeholder="e.g. examplerobert@gmail.com"
required
>



<br>


<label>
Phone Number*
</label>


<input
type="tel"
placeholder="e.g. +65 9876 5432"
>



</fieldset>



<fieldset>


<legend>
Date Of Birth
</legend>


<input
type="date"
>



</fieldset>







<fieldset>


<legend>
Gender
</legend>


<input
type="radio"
name="gender"
>
Male


<input
type="radio"
name="gender"
>
Female


<input
type="radio"
name="gender"
>
Other
<input type="text" name="otherGender" placeholder="Please specify">

</fieldset>




<fieldset>

<legend>
Nationality
</legend>

<select>

<option>-- Select Nationality --</option>
<option>Singapore</option>
<option>PR</option>
<option>Others</option>

</select>



</fieldset>

<fieldset>

<legend>
    Employment Details 
</legend>


<p><strong>Full-time or Part-time? *</strong></p>

<label>
    <input type="radio" name="employment" value="full-time">
    Full-time
</label>

<br>

<label>
    <input type="radio" name="employment" value="part-time">
    Part-time
</label>

<br><br>

<label>
    Lengh of commitment. and when you can start? *
</label>

<input
type="text"
placeholder="e.g. 6 months, 1 year, 2 years, etc." >


</fieldset>







<fieldset>


<legend>
About Yourself
</legend>



<textarea
rows="5"
placeholder="Tell us about yourself and why you would like to work with us..."
></textarea>



</fieldset>






<fieldset>


<legend>
Upload Resume/CV
</legend>



<input
type="file" accept="image/*"
>



</fieldset>









<fieldset>


<legend>
Anything else you would like us to know?
</legend>


<input
type="search"
>


</fieldset>










<button type="submit">

Submit

</button>



<button type="reset">

Reset

</button>



</form>
