<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | LJ Bakery</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            max-width: 500px;
        }

        h1 {
            color: #d2691e;
            font-size: 42px;
        }

        p {
            color: #555;
            font-size: 18px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #d2691e;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #a0522d;
        }

        .emoji {
            font-size: 60px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="emoji">🍰</div>

    <h1>Thank You!</h1>

    <p>
        Your order has been received successfully.
        Thank you for choosing <strong> LJ Bakery</strong>.
    </p>

    <p>
        We're excited to bake something special for you! 💖
        You will receive an order confirmation shortly.
    </p>

    <a href="index.html" class="btn">Return to Home</a>
</div>

</body>
</html>
